map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
limit_req_zone $http_authorization zone=ai_per_credential:10m rate=6r/m;

upstream backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    auth_basic "Hype Radar";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    client_max_body_size 11m;
    limit_req_status 429;

    gzip on;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /internal-health {
        auth_basic off;
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        return 204;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/api/chat(?:/transcribe)?$ {
        limit_req zone=api_per_ip burst=60 nodelay;
        limit_req zone=ai_per_credential burst=2 nodelay;
        include /etc/nginx/api-proxy.conf;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        include /etc/nginx/api-proxy.conf;
    }

    location = /health {
        proxy_pass http://backend;
        include /etc/nginx/proxy-headers.conf;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }

    location /ws/ {
        proxy_pass http://backend;
        include /etc/nginx/proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
