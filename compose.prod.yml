name: hype-radar-production

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-environment: &backend-environment
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
  DATABASE_ECHO: ${DATABASE_ECHO:-false}
  HYPERLIQUID_NETWORK: ${HYPERLIQUID_NETWORK:-mainnet}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env.production}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash}
  OPENROUTER_API_URL: ${OPENROUTER_API_URL:-https://openrouter.ai/api/v1/chat/completions}
  OPENROUTER_TRANSCRIPTION_MODEL: ${OPENROUTER_TRANSCRIPTION_MODEL:-openai/whisper-1}
  OPENROUTER_TRANSCRIPTION_API_URL: ${OPENROUTER_TRANSCRIPTION_API_URL:-https://openrouter.ai/api/v1/audio/transcriptions}
  OPENROUTER_TRANSCRIPTION_LANGUAGE: ${OPENROUTER_TRANSCRIPTION_LANGUAGE:-}
  OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:?Set OPENROUTER_SITE_URL in .env.production}
  OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Hype Radar}
  OPENROUTER_TIMEOUT_SECONDS: ${OPENROUTER_TIMEOUT_SECONDS:-60}
  OPENROUTER_MAX_COMPLETION_TOKENS: ${OPENROUTER_MAX_COMPLETION_TOKENS:-4096}
  OPENROUTER_MAX_AUDIO_BYTES: ${OPENROUTER_MAX_AUDIO_BYTES:-10485760}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hype_radar}
      POSTGRES_USER: ${POSTGRES_USER:-hype_radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - database
    logging: *default-logging
    stop_grace_period: 30s

  migrate:
    image: hype-radar-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  backend:
    image: hype-radar-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).read(1)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - database
      - edge
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  frontend:
    image: hype-radar-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-80}:80"
    volumes:
      - type: bind
        source: ${BASIC_AUTH_FILE:-./.secrets/htpasswd}
        target: /etc/nginx/auth/htpasswd
        read_only: true
        bind:
          create_host_path: false
    networks:
      - edge
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  postgres_data:

networks:
  database:
  edge:
